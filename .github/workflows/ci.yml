name: CI

# Quality gates for main, the installed R3D branch and every pull request (`cargo xtask ci`), through the
# suite's shared gate workflow in craft-common-actions.
on:
  push:
    branches: [main, r3d/update-0.15.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; branch push runs finish independently.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # Match the toolchain used to build and validate the installed R3D app.
      # Upgrade it deliberately alongside local verification, not via floating stable.
      toolchain: "1.95.0"
      # Same craft-fonts commit as release.yml.
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 90
      # xtask ci runs cargo test: the demo scene cache is per process, so nextest is slower here.
      tools: ""
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libgl1-mesa-dev libdbus-1-dev
